<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PawConnect – Available Pets</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/pets.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>Available pets</h1>
    <!-- PPAP-24 C04 -->
    <form id="filter-form" class="inline-form filters">
      <label for="type-filter">Animal type</label>
      <select id="type-filter" name="type">
        <option value="">All</option>
        <option>Dog</option>
        <option>Cat</option>
        <option>Rabbit</option>
        <option>Other</option>
      </select>
    </form>
    <p id="status" class="muted">Loading pets…</p>
    <div id="pet-list" class="pet-grid"></div>
  </main>
</body>
</html>
